# KM1 の検査 / KM1 checks
# push と pull request のたびに、clone したままの状態から全部の検査を流す（gen/check_all.sh と同じもの）。
# Runs every check from a clean clone on each push and pull request (same as gen/check_all.sh).
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-docs:
    name: トークン・Web・Office・PDF / tokens, web, Office, PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: '**/package-lock.json' }
      - name: 外部のコマンドと日本語の書体 / system tools and CJK fonts
        run: sudo apt-get update && sudo apt-get install -y poppler-utils librsvg2-bin fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: npm ci
        working-directory: gen
      - run: npm ci
        working-directory: office
      - name: 検査 / checks
        run: bash gen/check_all.sh
        env:
          CHROME: /usr/bin/google-chrome
  flutter:
    name: Flutter（解析・テスト）/ Flutter analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: 検証アプリに KM1 のファイルを入れる / put KM1 files into the verification app
        run: |
          cp km1_theme.dart km1_widgets.dart icons/km1_icons.dart icons/km1_icons_b.dart verify/flutter/lib/
          mkdir -p verify/flutter/fonts && cp icons/KM1Icons.ttf verify/flutter/fonts/
      - run: flutter pub get
        working-directory: verify/flutter
      # material.dart の非推奨（Flutter 3.47 以降、material_ui への移行）の「情報」では落とさない。エラーと警告では落とす
      # Don't fail on the material.dart deprecation infos (material_ui migration); errors and warnings still fail
      - run: flutter analyze --no-fatal-infos
        working-directory: verify/flutter
      # 承認済みの画像（test/goldens/*.png）と比べる。違えば失敗する。--update-goldens は使わない（使うと違いを見逃す）
      # Compare against approved goldens; never --update-goldens here, which would hide regressions
      - name: テスト（画像は承認済みのものと比べる）/ tests against approved goldens
        working-directory: verify/flutter
        run: |
          if ls test/goldens/*.png >/dev/null 2>&1; then
            flutter test
          else
            echo "::warning title=承認済みの画像がない / no approved goldens::画像の比較を飛ばした。goldens ワークフローで作り、目で確かめてから verify/flutter/test/goldens/ に入れる（verification.md 6 章）"
            flutter test --exclude-tags golden
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: flutter-golden-failures, path: verify/flutter/test/failures/, if-no-files-found: ignore }
