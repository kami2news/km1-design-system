<!-- @dsCard group="記録と早見図 / Records and guides" height=1180 -->
<style>
.dn{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:16px;font-family:var(--font-sans);color:var(--ink)}
@media (max-width:900px){.dn{grid-template-columns:1fr}}
.dn__col{display:flex;flex-direction:column;gap:16px;min-width:0}
.dn__h{margin:0;font:600 16px/22px var(--font-sans);display:flex;align-items:baseline;gap:8px}
.dn__h code{font:400 12px/16px Consolas,monospace;color:var(--ink-secondary)}
.dn__note{margin:0;font:400 12px/16px var(--font-sans);color:var(--ink-secondary)}
</style>
<div id="r"></div>
<script>
var h=React.createElement,F=window.Fluent2;
var D=[{id:1,name:'地球化学',day:'月 2 限',left:3},{id:2,name:'気象学',day:'水 1 限',left:12},{id:3,name:'統計演習',day:'金 4 限',left:1}];
var NOTE={compact:'カード 12px・項目の間 4px',regular:'カード 16px・項目の間 8px（既定・今までと同じ）',spacious:'カード 24px・項目の間 16px'};
function Col(p){var sl=React.useState([2]),it=React.useState([{id:'a',label:'レポート'},{id:'b',label:'実験準備',sub:'器具の確認'},{id:'c',label:'読書'}]);
  return h('section',{className:'dn__col','aria-labelledby':'dn-'+p.d},
    h('h2',{id:'dn-'+p.d,className:'dn__h'},p.title,h('code',null,'density="'+p.d+'"')),
    h('p',{className:'dn__note'},NOTE[p.d]),
    h(F.Card,{title:'今日の予定',density:p.d,headingLevel:3},h('p',{style:{margin:0}},'10:45 環境化学 第8回（W9-324）')),
    h(F.Table,{density:p.d,caption:'締め切りの近い課題（'+p.title+'）',rows:D,selectable:true,selected:sl[0],onSelectionChange:sl[1],bulkActions:[{label:'完了にする',onClick:function(){}}],
      columns:[{key:'name',label:'授業'},{key:'day',label:'時限'},{key:'left',label:'残り',align:'end',render:function(r){return r.left+' 日';}}]}),
    h(F.Table,{density:p.d,caption:'提出済みの課題（表示専用。'+p.title+'）',rows:[{id:'r1',name:'地球化学 第7回',when:'11/06'},{id:'r2',name:'気象学 演習',when:'11/05',link:true},{id:'r3',name:'統計演習 第5回',when:'11/01'}],
      columns:[{key:'name',label:'課題',render:function(r){return r.link?h('a',{className:'f2-link',href:'#'},r.name):r.name;}},{key:'when',label:'提出日',align:'end'}]}),
    h(F.SortableList,{density:p.d,id:'sl-'+p.d,label:'今日やる順（'+p.title+'）',items:it[0],onChange:it[1]}));}
ReactDOM.createRoot(document.getElementById('r')).render(h('div',{className:'dn'},
  h(Col,{d:'compact',title:'Compact'}),h(Col,{d:'regular',title:'Regular'}),h(Col,{d:'spacious',title:'Spacious'})));
</script>
