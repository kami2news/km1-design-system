<!-- @dsCard group="Forms" height=420 -->
<div id="r" style="padding:16px"></div>
<script>
var h=React.createElement,F=window.Fluent2;
ReactDOM.createRoot(document.getElementById('r')).render(h('div',{className:'f2-form'},
  h(F.FormGrid,{columns:2},
    h(F.Input,{label:'姓',required:true,autoComplete:'family-name'}),
    h(F.Input,{label:'名',required:true,autoComplete:'given-name'}),
    h(F.Input,{label:'メールアドレス',type:'email',required:true,span:'full',autoComplete:'email'}),
    h(F.Input,{label:'郵便番号',inputMode:'numeric',hint:'例: 152-8550',autoComplete:'postal-code'}),
    h(F.Select,{label:'都道府県',options:[{value:'tokyo',label:'東京都'},{value:'kanagawa',label:'神奈川県'}]}),
    h(F.Input,{label:'住所',span:'full',autoComplete:'street-address'}))));
</script>
